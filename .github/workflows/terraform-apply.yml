name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_pages_project_name: ${{ vars.TF_PAGES_PROJECT_NAME }}
      TF_VAR_pages_production_branch: ${{ vars.TF_PAGES_PRODUCTION_BRANCH || 'main' }}
      TF_VAR_enable_pages: ${{ vars.TF_ENABLE_PAGES || 'true' }}
      TF_VAR_r2_bucket_name: ${{ vars.TF_R2_BUCKET_NAME }}
      TF_VAR_r2_location: ${{ vars.TF_R2_LOCATION || 'WNAM' }}
      TF_VAR_enable_pages_custom_domain: ${{ vars.TF_ENABLE_PAGES_CUSTOM_DOMAIN || 'false' }}
      TF_VAR_pages_custom_domain: ${{ vars.TF_PAGES_CUSTOM_DOMAIN || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: >
          terraform init -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY || 'prod/terraform.tfstate' }}"
          -backend-config="region=auto"
          -backend-config="endpoint=https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          -backend-config="skip_credentials_validation=true"
          -backend-config="skip_metadata_api_check=true"
          -backend-config="skip_region_validation=true"
          -backend-config="force_path_style=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
